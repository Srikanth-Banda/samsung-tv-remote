name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      - name: Start server
        run: node server.js &

      - name: Wait for server
        run: until curl -sf http://localhost:8080/ > /dev/null; do sleep 1; done
        timeout-minutes: 1

      - name: Run tests
        run: node test-ui.js

      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push'

      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push'

      - name: Set lowercase image name
        if: github.event_name == 'push'
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH key
        run: |
          echo "${{ secrets.PI_SSH_KEY }}" > /tmp/pi_key
          chmod 600 /tmp/pi_key

      - uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Copy deploy files to Pi
        run: |
          ssh -i /tmp/pi_key -o StrictHostKeyChecking=no \
            srikanthbanda@${{ secrets.PI_HOST }} \
            'mkdir -p ~/deploy/samsung-tv-remote/scripts'
          scp -i /tmp/pi_key -o StrictHostKeyChecking=no \
            deploy/docker-compose.yml \
            srikanthbanda@${{ secrets.PI_HOST }}:~/deploy/samsung-tv-remote/docker-compose.yml
          scp -i /tmp/pi_key -o StrictHostKeyChecking=no \
            scripts/deploy.sh \
            srikanthbanda@${{ secrets.PI_HOST }}:~/deploy/samsung-tv-remote/scripts/deploy.sh

      - name: Deploy
        run: |
          ssh -i /tmp/pi_key -o StrictHostKeyChecking=no \
            srikanthbanda@${{ secrets.PI_HOST }} \
            'bash ~/deploy/samsung-tv-remote/scripts/deploy.sh'

      - name: Health check
        run: |
          for i in $(seq 1 6); do
            curl -sf http://${{ secrets.PI_HOST }}:8080/ > /dev/null && exit 0
            sleep 5
          done
          exit 1
